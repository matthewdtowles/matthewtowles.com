name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one deploy at a time, and never cancel one partway through an upload.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Mermaid diagrams render through a headless browser at build time.
      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Fingerprinted assets first, so a page is never served before the assets
      # it references exist. Deleting is deferred to the HTML pass below.
      - name: Upload fingerprinted assets
        run: |
          aws s3 sync dist/ s3://${{ vars.SITE_BUCKET }}/ \
            --exclude "*" --include "_astro/*" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload pages
        run: |
          aws s3 sync dist/ s3://${{ vars.SITE_BUCKET }}/ \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate" \
            --delete

      # Only pages need invalidating. Assets are fingerprinted, so their URLs
      # change instead of their contents.
      - name: Invalidate pages
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/" "/*.html" "/projects/*" "/sitemap*.xml"
